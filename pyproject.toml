[project]
name = "shelfsight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "tenacity>=8.2",
  "rapidfuzz>=3.9",
  "tldextract>=5.1",
  "duckdb>=1.1",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelfsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
